name: Deploy presentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build presentation
        run: npm run build -- --base "${{ steps.pages.outputs.base_path }}/"
      - name: Install Chromium for presentation checks
        run: npx playwright install --with-deps chromium
      - name: Verify presentation pages
        env:
          SHOW_BASE: http://127.0.0.1:4173${{ steps.pages.outputs.base_path }}
        run: |
          npm run preview -- --port 4173 --base "${{ steps.pages.outputs.base_path }}/" > /tmp/capstone-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail "$SHOW_BASE/" > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail "$SHOW_BASE/" > /dev/null
          npm run test:slides
      - name: Preserve browser verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presentation-checks
          path: exports/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v4
